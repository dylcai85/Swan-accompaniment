name: Build and deploy

# Kept minimal on purpose: the full suite (typecheck, unit, e2e, eval) runs locally
# before every push (CLAUDE.md). CI only guards against score files, builds, and deploys.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'fixtures/real/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:no-score
      - run: npm run build
      - run: npm run check:no-score
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
