name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:no-score
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: No score files in build output
        run: npm run check:no-score
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run score:inspect
      - run: npm run eval
